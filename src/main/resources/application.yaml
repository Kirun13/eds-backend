spring:
  datasource:
    url: jdbc:${SPRING_DATASOURCE_URL}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate 
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 3600000 # 1 hours
      refresh-token:
        expiration: 604800000 # 7 days

server:
  port: 8080
